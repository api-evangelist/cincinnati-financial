aid: cincinnati-financial
name: Cincinnati Financial
description: >-
  Cincinnati Financial Corporation (NASDAQ: CINF) is a property and casualty insurance
  holding company in Fairfield, Ohio, whose subsidiaries — The Cincinnati Insurance
  Company, The Cincinnati Indemnity Company, The Cincinnati Casualty Company, The
  Cincinnati Specialty Underwriters Insurance Company and The Cincinnati Life Insurance
  Company — market business, home, auto and life insurance plus fixed annuities
  exclusively through independent insurance agencies. Cincinnati Insurance does run an API
  program for integration partners: it publishes an API Terms and Conditions Agreement
  licensing "the Cincinnati Insurance APIs" and charges no fee at present. But that
  agreement is a legal instrument only — it names no protocol, endpoint or auth scheme,
  and the per-API "API Policy" it incorporates by reference is never published. Access
  starts with an acceptance form, after which Cincinnati contacts the applicant; there is
  no developer portal, public reference or machine-readable contract.
