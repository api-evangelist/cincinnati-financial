x-coverage:
  state: gated
  reason: sales-gate
  detail: >-
    Cincinnati Insurance does run an API program — it publishes an API Terms and Conditions
    Agreement licensing "the Cincinnati Insurance APIs" and charges no fee for them — but the
    only public page in its 231-URL sitemap that touches the program is an acceptance form
    that collects name, email, title and organization behind a reCAPTCHA and answers "We'll be
    in contact with you shortly"; the per-API "API Policy" documentation the agreement
    incorporates by reference nine times is never published, and no OpenAPI, reference, base
    URL or auth scheme is reachable anonymously on any cinfin.com host.
