note: >-
  No numeric rate limit, window, burst allowance, exhaustion status code or RateLimit-*
  response header is published anywhere on Cincinnati Insurance's public surface. The API
  Terms and Conditions Agreement confirms limits EXIST without ever stating one: section 7
  forbids a Provider to "Circumvent or attempt to circumvent any limits placed on Provider's
  use of the APIs by Cincinnati Insurance", to "Use a disproportionate amount of bandwidth",
