note: >-
  Cincinnati Financial serves exactly one well-known document: an RFC 9116
  security.txt on cinfin.com and www.cinfin.com carrying a single Contact line
  (mailto:bugbounty@cinfin.com). No expires, encryption, policy or preferred-languages
  field is published, so the file is below RFC 9116 minimums even though it is real.
  Every other named path 404s on the Sitecore-served marketing site. onlineservice.cinfin.com
  answers HTTP 200 with a ~23KB HTML login shell for EVERY /.well-known/ path probed —
  a catch-all, not a document — and is recorded as a miss on content, not on status.
  cincilink.cinfin.com (IBM Security Verify Access / WebSEAL B2B auth) 302s every path
  to its login. Note also that https://www.cinfin.com/robots.txt carries
  "Disallow: /.well-known/" while the origin serves security.txt at 200 — the file is
  published but the site asks crawlers not to read it.
